name: Build Custom ROM (Self-Hosted Runner)

on:
  workflow_dispatch:
    inputs:
      rom_manifest:
        description: 'ROM Manifest URL'
        required: true
        default: 'https://github.com/Lunaris-AOSP/android.git'
      rom_branch:
        description: 'ROM Manifest Branch'
        required: true
        default: '16.2'
      device_codename:
        description: 'Device Codename'
        required: true
        default: 'lexus'
      build_type:
        description: 'Build Type (userdebug, user, eng)'
        required: true
        default: 'userdebug'
      build_command:
        description: 'Build Command (e.g. m bacon)'
        required: true
        default: 'm bacon'

jobs:
  build:
    name: Build on Self-Hosted Machine
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ROM
        run: |
          mkdir -p ~/android-rom
          cd ~/android-rom
          bash $GITHUB_WORKSPACE/scripts/build_rom.sh \
            "${{ github.event.inputs.rom_manifest }}" \
            "${{ github.event.inputs.rom_branch }}" \
            "${{ github.event.inputs.device_codename }}" \
            "${{ github.event.inputs.build_type }}" \
            "${{ github.event.inputs.build_command }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROM-Zip
          path: ~/android-rom/out/target/product/${{ github.event.inputs.device_codename }}/*.zip
