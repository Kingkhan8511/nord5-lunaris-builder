name: Build Custom ROM (Self-Hosted Runner)

on:
  workflow_dispatch:
    inputs:
      rom_manifest:
        description: 'ROM Manifest URL'
        required: true
        default: 'https://github.com/Lunaris-AOSP/android.git'
      rom_branch:
        description: 'ROM Manifest Branch'
        required: true
        default: '16.2'
      device_codename:
        description: 'Device Codename'
        required: true
        default: 'lexus'
      build_type:
        description: 'Build Type (userdebug, user, eng)'
        required: true
        default: 'userdebug'
      build_command:
        description: 'Build Command (e.g. m bacon)'
        required: true
        default: 'm bacon'

jobs:
  build:
    name: Build on Self-Hosted Machine
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          mkdir -p ~/android-rom
          cd ~/android-rom
          
          # Initialize ROM source
          repo init -u ${{ github.event.inputs.rom_manifest }} -b ${{ github.event.inputs.rom_branch }} --git-lfs
          
          # Setup local manifests
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/manifests/nord5.xml .repo/local_manifests/nord5.xml
          
          # Sync trees
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Compile ROM
        run: |
          cd ~/android-rom
          source build/envsetup.sh
          lunch lunaris_${{ github.event.inputs.device_codename }}-${{ github.event.inputs.build_type }} || lunch lineage_${{ github.event.inputs.device_codename }}-${{ github.event.inputs.build_type }} || lunch ${{ github.event.inputs.device_codename }}-${{ github.event.inputs.build_type }}
          ${{ github.event.inputs.build_command }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROM-Zip
          path: ~/android-rom/out/target/product/${{ github.event.inputs.device_codename }}/*.zip
